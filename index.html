<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Barrage Boss Rush</title>
    <style>
      :root {
        --bg: #080b18;
        --panel: #101a33;
        --panel-2: #16264a;
        --line: #79f2ff;
        --text: #e8fbff;
        --accent: #ffe66d;
        --danger: #ff5c7a;
        --safe: #7dff9b;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 10%, #1b2b63 0 6%, transparent 18%),
          radial-gradient(circle at 84% 78%, #321a5d 0 7%, transparent 22%),
          linear-gradient(180deg, #090d20, #030611 70%);
        font-family: "Courier New", "MS Gothic", monospace;
        image-rendering: pixelated;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(0deg, #ffffff08 0 2px, transparent 2px 4px);
        mix-blend-mode: screen;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }

      canvas {
        width: min(100vw, 1120px);
        height: min(100vh, 720px);
        max-width: 100vw;
        max-height: 100vh;
        border: 4px solid var(--line);
        background: #050817;
        box-shadow: 0 0 0 4px #10234f, 0 0 28px #35ccff55;
        image-rendering: pixelated;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #02040dcc;
      }

      .overlay.hidden { display: none; }

      .panel {
        width: min(680px, 92vw);
        padding: 24px;
        text-align: center;
        background: var(--panel);
        border: 4px solid var(--line);
        box-shadow: 0 0 0 4px #071126 inset, 8px 8px 0 #0008;
      }

      h1, h2, p { margin: 10px 0; }
      h1 { color: var(--accent); font-size: clamp(28px, 6vw, 54px); text-shadow: 4px 4px 0 #000; }
      .sub { color: #a9d9ff; line-height: 1.7; }

      button {
        margin-top: 16px;
        padding: 12px 22px;
        color: var(--text);
        background: var(--panel-2);
        border: 3px solid var(--line);
        font: inherit;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 4px 4px 0 #0008;
      }
      button:hover { color: #071126; background: var(--accent); }

      .practice-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: end;
        gap: 12px;
        margin-top: 10px;
      }

      label {
        display: grid;
        gap: 6px;
        color: #a9d9ff;
        font-size: 14px;
        text-align: left;
      }

      select {
        min-width: 220px;
        padding: 11px 14px;
        color: var(--text);
        background: #060b1b;
        border: 3px solid #3a5b83;
        font: inherit;
        font-weight: bold;
        image-rendering: pixelated;
      }

      .kbd {
        display: inline-block;
        min-width: 28px;
        padding: 2px 6px;
        color: var(--safe);
        border: 2px solid #3a5b83;
        background: #060b1b;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="gameCanvas" width="1120" height="720" aria-label="弾幕ゲーム画面"></canvas>
    </main>

    <section id="titleOverlay" class="overlay">
      <div class="panel">
        <h1>PIXEL BARRAGE</h1>
        <p class="sub">複数ステージのボスラッシュ弾幕ゲーム</p>
        <p class="sub">
          移動: <span class="kbd">↑</span><span class="kbd">↓</span><span class="kbd">←</span><span class="kbd">→</span>
          または <span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span><br />
          微調整: <span class="kbd">X</span> を押している間は低速移動します。<br />
          自機は常に前方へショットを撃ち、ボスに 1 ダメージを与えます。<br />
          ボスは動かず、高耐久で複数の弾幕を同時に重ねてきます。<br />
          画面右端の HP バーを削り切ると次のステージへ進みます。
        </p>
        <button id="startButton">ゲーム開始</button>
        <div class="practice-row">
          <label>
            プラクティス開始ステージ
            <select id="practiceStageSelect" aria-label="プラクティス開始ステージ"></select>
          </label>
          <button id="practiceButton">プラクティスモード</button>
        </div>
      </div>
    </section>

    <section id="resultOverlay" class="overlay hidden">
      <div class="panel">
        <h2 id="resultTitle">RESULT</h2>
        <p id="resultText" class="sub"></p>
        <button id="restartButton">もう一度遊ぶ</button>
      </div>
    </section>

    <script type="module" src="main.js"></script>
  </body>
</html>
